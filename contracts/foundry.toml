[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The SlabRenderer tests compare against SVGs drawn by design/slab.mjs.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[rpc_endpoints]
whitechain_sepolia = "https://rpc.testnet.whitechain.io"
